<div class="table-wrap"><table><thead><tr><th>Sumber</th><th>Jumlah pesanan</th><th>Selesai</th><th class="num">Nilai pesanan selesai</th></tr></thead><tbody>
{% for name,group in groups %}<tr><td>{{ name }}</td><td>{{ group.jumlah }}</td><td>{{ group.selesai }}</td><td class="num">{{ group.nilai|rupiah }}</td></tr>{% else %}<tr><td colspan="4">Belum ada data sesuai filter.</td></tr>{% endfor %}
</tbody></table></div>
