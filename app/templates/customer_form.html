{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">PELANGGAN</span><h1>{{ 'Edit' if editing else 'Tambah' }} pelanggan</h1></div></div><section class="panel"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="form-grid"><div><label for="nama">Nama pelanggan *</label><input name="nama" id="nama" value="{{ customer.nama or '' }}" required minlength="2" maxlength="100"></div><div><label for="no_telepon">Nomor telepon</label><input name="no_telepon" id="no_telepon" value="{{ customer.no_telepon or '' }}" maxlength="25" placeholder="08xxxxxxxxxx"><p class="footnote">Boleh kosong jika nomor tidak tersedia dari sumber pesanan.</p></div></div><div class="form-actions"><button class="button">Simpan pelanggan</button><a href="{{ url_for('customers.index') }}">Kembali</a></div></form></section>{% endblock %}
